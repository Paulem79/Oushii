# This file is used for Gradle options, for the rest use stonecutter.properties.toml
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Caps the worker count so NeoForge/Forge nodes don't decompile Minecraft on every
# core at once and exhaust memory
org.gradle.workers.max=4

# Loom version for loom-back-compat; it reads this as a Gradle property, so it can no
# longer live in stonecutter.properties.toml
loomx.loom_version=1.18-SNAPSHOT

minotaur.changelog=## Oushii 1.2.0\n\
\n\
### Added\n\
- Minecraft 26.4 support (Fabric; NeoForge follows once a 26.4 build ships)\n\
\n\
### Compatibility with explosion and TNT mods\n\
- Blast resistance now goes through vanilla's explosion damage calculator instead of\n\
  reading the block's raw value, so mods that retune it are respected - TNT Breaks\n\
  Bedrock and TNTUtils among them. On NeoForge this is also what forwards to\n\
  IBlockExtension#getExplosionResistance.\n\
- Blocks can veto their own destruction (shouldBlockExplode) and their own drops\n\
  (dropFromExplosion).\n\
- Modded TNT blocks now chain: every destroyed block gets its vanilla wasExploded\n\
  reaction, which is where a TNT block primes its own entity.\n\
- Modded TNT entities keep their own behaviour. Oushii only takes over the tick of\n\
  vanilla PrimedTnt, so mods that subclass it with their own explosion are left alone.\n\
\n\
### Fixed\n\
- The license header check never actually ran: its target pushed a glob through a File\n\
  path, and Spotless cannot read the shared sources from a version node at all. It now\n\
  runs once on the root project.\n\
\n\
### Internal\n\
- Replaced the uses of Mth.clamp and the 4-arg Block.getDrops that 26.4 removed\n
minotaur.debugMode=false