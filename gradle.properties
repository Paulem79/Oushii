# This file is used for Gradle options, for the rest use stonecutter.properties.toml
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Caps the worker count so NeoForge/Forge nodes don't decompile Minecraft on every
# core at once and exhaust memory
org.gradle.workers.max=4

# Loom version for loom-back-compat; it reads this as a Gradle property, so it can no
# longer live in stonecutter.properties.toml
loomx.loom_version=1.18-SNAPSHOT

minotaur.changelog=## Oushii 1.1.0\n\
\n\
### Added\n\
- Minecraft 26.3 support, on both Fabric and NeoForge\n\
\n\
### Changed\n\
- Fabric Loader updated to 0.20.0\n\
- Fabric API updated to its latest build on 1.20.1, 1.21.1, 26.1 and 26.2\n\
- NeoForge updated to its latest build on every supported version\n\
- MidnightLib updated to 1.10.0 on 1.21.1 and newer, and enabled on 26.3\n\
  (the bundled JSON config is still used where MidnightLib has no build)\n\
\n\
### Internal\n\
- Gradle logic shared by the Fabric, Forge and NeoForge build scripts moved into buildSrc\n
minotaur.debugMode=false